<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Company List</title>
</head>
<body>
<h1>Company List</h1>
<p><a href="/companies/add">[Add New Company]</a></p>

<table border="1" cellpadding="5" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Company Name</th>
        <th>Email</th>
        <th>Employees Count</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="company : ${companies}">
        <td th:text="${company.id}">1</td>
        <td th:text="${company.companyName}">Company Name</td>
        <td th:text="${company.email}">email@example.com</td>
        <td th:text="${company.users != null ? company.users.size() : 0}">0</td>
        <td>
            <a th:href="@{'/companies/edit/' + ${company.id}}">[Edit]</a>
            <a th:href="@{'/companies/' + ${company.id} + '/employees'}">[Manage Employees]</a>
            <form th:action="@{'/companies/delete/' + ${company.id}}" method="post" style="display:inline;">
                <input type="submit" value="Delete" 
                       onclick="return confirm('Are you sure you want to delete this company?')" />
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
